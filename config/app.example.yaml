# 配置模板：复制为 config/app.yaml 并填入真实值
#   cp config/app.example.yaml config/app.yaml
# app.yaml 已被 .gitignore 忽略，切勿提交真实密码

database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "CHANGE_ME" # 生产环境建议改用环境变量 DB_PASSWORD
  dbname: "dict"

tables:
  # 表名带日期后缀，随数据更新变化
  places: "places_260202"
  names: "names_260202"

fields:
  query_field: "name_for_query_251202"
  # 预清洗查询列（括号已在导入时替换为空格），需先执行 scripts/add_name_for_query_clean.sql
  # 列不存在时自动回退到 query_field + REPLACE 方式
  query_field_clean: "name_for_query_clean"
  name_field: "name"
  nation_field: "nation"
  translation_field: "translation"

server:
  port: 8080

cache:
  directory: "./cache"
  # 6小时：词典数据按月换表，长TTL对爬虫重复词命中负缓存更有效
  expiration: 21600

log:
  directory: "./logs"

security:
  # 可信代理IP列表，为空时不信任任何代理头（最安全）
  # 示例：["127.0.0.1", "10.0.0.0/8"] 或 ["0.0.0.0/0"] 信任所有
  trusted_proxies: [127.0.0.1]
  # API速率限制（每分钟请求数），0表示不限制
  rate_limit: 15
  # 全局同时进行的未命中缓存搜索上限（0用默认4），保护共享数据库不被并发全表扫描拖垮
  max_concurrent_searches: 4
  # 单个IP同时进行的未命中缓存搜索上限（0用默认1）
  max_concurrent_per_ip: 1

turnstile:
  # Cloudflare Turnstile 人机校验：enabled 且 secret 非空时 /api/search 强制校验 token
  # secret 建议不写在此文件，改用环境变量 TURNSTILE_SECRET（优先级更高）
  enabled: false
  # 站点密钥（公开值，前端渲染用；由 Cloudflare 控制台签发）
  site_key: "CHANGE_ME_SITE_KEY"
  # 服务端校验密钥（敏感！切勿提交到版本库）
  secret_key: ""
  # 前端 widget 的 action，服务端校验时必须匹配
  action: "search"
  # siteverify 返回的 hostname 白名单，为空则不校验
  hostnames: ["dict.hanlei.name"]
