<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <title>世界人名地名译法查询工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>世界人名地名译法查询工具</h1>
        </header>

        <main>
            <section class="search-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="输入人名或地名"
                        autocomplete="off"
                    >
                    <button id="searchBtn" type="button">查询</button>
                </div>

                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="searchType" value="names">
                        <span class="radio-custom"></span>
                        查人名
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="searchType" value="places">
                        <span class="radio-custom"></span>
                        查地名
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="searchType" value="both" checked>
                        <span class="radio-custom"></span>
                        同时查人名地名
                    </label>
                </div>
            </section>

            <section class="loading-section" id="loadingSection" style="display: none;">
                <div class="loading-spinner"></div>
                <p>查询中...</p>
            </section>

            <section class="results-section" id="resultsSection" style="display: none;">
                <div id="resultsContainer"></div>
            </section>

            <section class="error-section" id="errorSection" style="display: none;">
                <div class="error-message" id="errorMessage"></div>
            </section>
        </main>

        <footer>
            <p><a href="history.html" class="copy-link" target="_blank">版本历史</a>&nbsp;<a href="http://resource.ttplus.cn/publish/app/data/2016/04/05/6754/share1.html" class="copy-link" target="_blank">数据来源</a>&nbsp;<a href="http://hanlei.name" class="copy-link" target="_blank">作者网站</a></p>
            <p>问题反馈：1616280@qq.com或微信gzhanlei</p>
            <p>&copy; 2026 世界人名地名译法查询工具 &nbsp;</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
